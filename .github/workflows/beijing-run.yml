name: HUATAI Data Pipeline (Beijing Time)

on:
  workflow_dispatch:

  schedule:
    - cron: '0 2 * * *'   # 北京时间 10:00（UTC+8）

jobs:
  run-data-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set timezone to Beijing
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          date

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests textblob

      - name: Debug repo structure
        run: |
          echo "===== ROOT ====="
          ls
          echo "===== SRC ====="
          ls src

      - name: Run sentiment script
        run: |
          python src/phase2_sentiment_gdelt.py
