name: HUATAI Data Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "10 1 * * *"   # 每天北京时间 09:10（UTC+8）

jobs:
  run-data-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests textblob

      - name: Run sentiment script
        run: |
          python src/phase2_sentiment_gdelt.py

      - name: Commit updated data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "auto update data" || echo "No changes"
          git push
