name: HUATAI Data Pipeline

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron 使用 UTC 时间；北京时间 = UTC+8
    # 每天北京时间 09:10 => UTC 01:10
    - cron: "10 1 * * *"

jobs:
  run-data-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 方便后面 commit/push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Show repo structure (debug)
        run: |
          echo "PWD=$(pwd)"
          echo "=== ls -la ==="
          ls -la
          echo "=== ls -la src ==="
          ls -la src || true
          echo "=== ls -la data ==="
          ls -la data || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests textblob

      - name: Run sentiment script
        run: |
          python src/phase2_sentiment_gdelt.py

      - name: Commit updated data (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "auto: update data" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push
